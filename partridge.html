<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <title>Interactive Partridge Puzzle</title>
    <link rel="stylesheet" href="styles/styles.css" />
</head>

<body>
    <div class="content">
        <div id="app">
            <div id="controls" class="appElements">
                <input type="number" min="1" max="16" value="9" id="puzzleTypeInput">
                <div class="controlSubFunctions">
                    <button class="button-pretty">Test Current Configuration</button>
                    <svg width="100px" height="50px">
                        <circle id="sign" r="20" cx="50" cy="27.5" />
                    </svg>
                </div>
                <div class="controlSubFunctions">
                    <button class="button-pretty">Find a Solution</button>
                    <div id="visualizer">
                        <label>Visualizer:</label>
                        <input type="checkbox">
                    </div>
                </div>
            </div>
            <canvas id="canvas" width="1200" height="600" class="appElements">
                Failed to Load Puzzle
            </canvas>
        </div>
    </div>
    <script type="module" src="puzzle.js"></script>
</body>

</html>
