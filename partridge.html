<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <title>Interactive Partridge Puzzle</title>
    <link rel="apple-touch-icon" sizes="180x180" href="./images/apple-touch-icon.png">
    <link rel="icon" type="image/png" sizes="32x32" href="./images/favicon-32x32.png">
    <link rel="icon" type="image/png" sizes="16x16" href="./images/favicon-16x16.png">
    <link rel="manifest" href="./images/site.webmanifest">
    <link rel="stylesheet" href="./styles/styles.css" />
</head>

<body>
    <div class="content">
        <div id="app">
            <canvas id="canvas" width="1100" height="600" class="appElements">
                Failed to Load Puzzle
            </canvas>
            <div id="controls" class="appElements">
                <input type="number" min="1" max="16" value="8" id="puzzleTypeInput">
                <div class="controlSubFunctions">
                    <button id="isSolvableButton" class="button-pretty">Test Current Configuration</button>
                    <svg width="100px" height="40px" class="light" id="myLight">
                        <circle id="signBackground" r="20" cx="50" cy="20" />
                        <circle id="sign" r="17" cx="50" cy="20" fill="grey" stroke="rgb(27, 27, 27)"
                            stroke-width="0" />
                        <circle id="spinner" r="14" cx="50" cy="20" fill="none" stroke="whitesmoke" stroke-width="0"
                            stroke-dasharray="62" stroke-linecap="round" stroke-dashoffset="0" />

                        <!-- Cancel icons created by Alfredo Hernandez - Flaticon 
                            "https://www.flaticon.com/free-icons/cancel" -->
                        <image id="cancelSolve" x="38" y="8" width="24" height="24" href="./images/multiply.svg"
                            style="opacity: 0;" />

                    </svg>
                    <div class="controlSubFunctions">
                        <button id="findSolutionButton" class="button-pretty">Find a Solution</button>
                        <div id="visualizer">
                            <label for="visualizerToggle">Visualizer:
                                <input type="checkbox" id="visualizerToggle" class="input">
                            </label>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
    <script type="module" src="puzzle.js"></script>
</body>

</html>
